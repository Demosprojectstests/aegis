apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-pod-resources
spec:
  validationActions:
    - Deny
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchConditions:
    - name: only-pulse
      expression: object.metadata.namespace == "pulse"
  validations:
    - message: Every container must set CPU and memory requests and limits.
      expression: >-
        object.spec.containers.all(c,
          has(c.resources) &&
          has(c.resources.requests) &&
          has(c.resources.limits) &&
          'cpu' in c.resources.requests &&
          'memory' in c.resources.requests &&
          'cpu' in c.resources.limits &&
          'memory' in c.resources.limits
        )
