apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-latest-tag
spec:
  validationActions:
    - Deny
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchConditions:
    - name: only-pulse
      expression: object.metadata.namespace == "pulse"
  validations:
    - message: Images must use a pinned tag. The latest tag is not allowed.
      expression: >-
        object.spec.containers.all(c,
          c.image.contains(":") &&
          !c.image.endsWith(":latest") &&
          !c.image.contains(":latest@")
        )
