apiVersion: v1
kind: Pod
metadata:
  name: loadgen
  namespace: pulse
spec:
  restartPolicy: Never
  containers:
    - name: loadgen
      image: busybox:1.36
      command: ["/bin/sh","-c"]
      args: ["while true; do wget -q -O- http://gateway.pulse.svc.cluster.local/; done"]
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          cpu: 200m
          memory: 64Mi
